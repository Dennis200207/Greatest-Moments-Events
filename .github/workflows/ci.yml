name: Build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudinary-migration, phase-2-admin-dashboard]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite build
        env:
          VITE_SUPABASE_URL: https://maeecnujogwfphhvumpm.supabase.co
          VITE_SUPABASE_ANON_KEY: validation-placeholder
        run: npm run build
